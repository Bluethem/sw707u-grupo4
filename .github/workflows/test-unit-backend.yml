name: Backend unit tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-test-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: src/backend/go.sum
      - name: Run unit tests
        run: go test ./internal/platform/auth/ ./internal/facturacion/domain/ ./internal/platform/config/ -count=1
