services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ff}
      POSTGRES_DB: ${POSTGRES_DB:-flowfacture}
    # Sin puerto en el host: evita choque con Postgres local en :5432.
    # api/seed/worker hablan por la red interna (hostname "postgres").
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ff} -d ${POSTGRES_DB:-flowfacture}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Corre migraciones + demo (empresa, usuarios, catálogo, clientes, ventas y resúmenes). Idempotente.
  seed:
    build:
      context: ./src/backend
      args:
        CMD_PATH: ./cmd/seed
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://ff:ff@postgres:5432/flowfacture?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./src/backend
      args:
        CMD_PATH: ./cmd/api
    env_file:
      - .env
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATABASE_URL: postgres://ff:ff@postgres:5432/flowfacture?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      BLOB_DIR: /data/blobs
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:3000}
    volumes:
      - blobs:/data/blobs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  worker:
    build:
      context: ./src/backend
      args:
        CMD_PATH: ./cmd/worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://ff:ff@postgres:5432/flowfacture?sslmode=disable
      SUNAT_FAKE_MODE: ${SUNAT_FAKE_MODE:-accept}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-false}
      BLOB_DIR: /data/blobs
    volumes:
      - blobs:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: ./src/frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  blobs:
