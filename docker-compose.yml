services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ff
      POSTGRES_PASSWORD: ff
      POSTGRES_DB: flowfacture
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ff -d flowfacture"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src/backend
      args:
        CMD_PATH: ./cmd/api
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://ff:ff@postgres:5432/flowfacture?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./src/backend
      args:
        CMD_PATH: ./cmd/worker
    environment:
      DATABASE_URL: postgres://ff:ff@postgres:5432/flowfacture?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./src/frontend
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
