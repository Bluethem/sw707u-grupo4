services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ff}
      POSTGRES_DB: ${POSTGRES_DB:-flowfacture}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ff} -d ${POSTGRES_DB:-flowfacture}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src/backend
      args:
        CMD_PATH: ./cmd/api
    env_file:
      - .env
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://ff:ff@postgres:5432/flowfacture?sslmode=disable}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./src/backend
      args:
        CMD_PATH: ./cmd/worker
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://ff:ff@postgres:5432/flowfacture?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./src/frontend
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
